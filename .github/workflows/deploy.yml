name: Build and Deploy Sistem RT to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS (aaPanel / Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH & Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            DEPLOY_PATH="/www/wwwroot/catatan_rt"
            
            echo "📁 Target directory: $DEPLOY_PATH"
            
            # 1. Fix safe directory permission untuk Git di aaPanel
            git config --global --add safe.directory "$DEPLOY_PATH" || true
            
            # 2. Clone jika folder belum ada, atau pull jika sudah ada
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "✨ Cloning repository..."
              mkdir -p "$DEPLOY_PATH"
              git clone https://github.com/MegonoComunity/sistem-rt.git "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            else
              echo "🔄 Updating codebase with latest changes..."
              cd "$DEPLOY_PATH"
              git reset --hard
              git pull origin main
            fi

            # 3. Pastikan file .env tersedia (jika belum ada, salin dari .env.example)
            if [ ! -f ".env" ]; then
              echo "⚙️ Creating default .env from .env.example..."
              cp .env.example .env
            fi

            # 4. Build & Jalankan Docker Container (Database aman di volume terpisah)
            echo "🐳 Building & restarting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans

            # 5. Bersihkan Docker image yang tidak terpakai
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Deployment successful! Sistem RT is running at /www/wwwroot/catatan_rt"
