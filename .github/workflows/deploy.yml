name: Build and Deploy Sistem RT to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS (aaPanel / Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH & Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_PATH="/www/wwwroot/catatan_rt"
            
            echo "📁 Target directory: $DEPLOY_PATH"
            
            # 0. Fix Network: Prioritaskan IPv4 jika VPS tidak memiliki route IPv6
            echo "🌐 Configuring network to prioritize IPv4 for Docker Hub..."
            if [ -f /etc/gai.conf ]; then
              sed -i 's/#precedence ::ffff:0:0\/96  100/precedence ::ffff:0:0\/96  100/' /etc/gai.conf 2>/dev/null || true
              grep -q "precedence ::ffff:0:0/96 100" /etc/gai.conf 2>/dev/null || echo "precedence ::ffff:0:0/96 100" >> /etc/gai.conf 2>/dev/null || true
            else
              echo "precedence ::ffff:0:0/96 100" > /etc/gai.conf 2>/dev/null || true
            fi
            
            # Pastikan DNS Docker daemon memakai IPv4 (Google / Cloudflare DNS)
            if [ ! -f /etc/docker/daemon.json ]; then
              mkdir -p /etc/docker
              echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' > /etc/docker/daemon.json 2>/dev/null || true
              systemctl restart docker 2>/dev/null || service docker restart 2>/dev/null || true
            fi

            # 1. Pastikan direktori ada & set safe directory Git untuk aaPanel
            mkdir -p "$DEPLOY_PATH"
            git config --global --add safe.directory "$DEPLOY_PATH" || true
            cd "$DEPLOY_PATH"
            
            # 2. Inisialisasi Git & sync kode terbaru (Aman meskipun folder aaPanel berisi file default)
            if [ ! -d ".git" ]; then
              echo "✨ Initializing Git repository..."
              git init
              git remote add origin https://github.com/MegonoComunity/sistem-rt.git || git remote set-url origin https://github.com/MegonoComunity/sistem-rt.git
              git fetch origin main
              git reset --hard origin/main
              git branch --set-upstream-to=origin/main main || true
            else
              echo "🔄 Updating codebase from main branch..."
              git remote set-url origin https://github.com/MegonoComunity/sistem-rt.git || true
              git fetch origin main
              git reset --hard origin/main
            fi

            # 3. Siapkan file .env jika belum ada
            if [ ! -f ".env" ]; then
              echo "⚙️ Creating default .env from .env.example..."
              cp .env.example .env
            fi

            # 4. Build & Jalankan Docker Container
            echo "🐳 Building and starting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans

            # 5. Bersihkan Docker image lama yang tidak terpakai
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Deployment successful! Sistem RT is running at /www/wwwroot/catatan_rt"
