name: 🚀 Auto Deploy to VPS (aaPanel / Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/www/wwwroot/sistem-rt' }}"

            echo "📂 Target directory: $DEPLOY_PATH"

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "✨ Cloning repository..."
              mkdir -p $(dirname "$DEPLOY_PATH")
              git clone https://github.com/MegonoComunity/sistem-rt.git "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            else
              echo "🔄 Pulling latest changes from main branch..."
              cd "$DEPLOY_PATH"
              git fetch origin main
              git reset --hard origin/main
            fi

            # Siapkan file .env jika belum ada
            if [ ! -f ".env" ]; then
              echo "⚙️ Creating default .env from .env.example..."
              cp .env.example .env
            fi

            echo "🐳 Building and starting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Deployment successful! Sistem RT is up and running."
